# Curated figures of delivery 2 (regularisation), redrawn from experiments/ in the experiment style (plot_theme.py),
# English labels, PNG. Captions (caption_es) in Spanish. Selection fixed here, on validation metrics only.

- id: overfitting_curves
  type: learning_curves
  select:
    runs:
      - {variant: EXP-010_bs256_sqrt_60ep, label: "delivery 1 (no regularisation)"}
      - {variant: EXP-021_final, label: "delivery 2 (BN + rotations)"}
  options: {metric: accuracy, show_train: true, smooth: 1, title: "Train vs validation accuracy per epoch (mean of 3 seeds)"}
  layout: half
  caption_es: "Accuracy de train (discontinua) y de validación (continua) por época del modelo de la entrega 1 y del de esta entrega; media de 3 semillas, banda = mínimo y máximo. Por época solo se registra la accuracy de train (no el mean recall); la del modelo regularizado se mide con augmentation."
  caption_slides_es: "Train (discontinua) y validación (continua), entregas 1 y 2."

- id: dropout_curve
  type: strength
  select: {base: EXP-010_bs256_sqrt_60ep, prefix: EXP-013_dropout, param: dropout}
  options: {metric: mean_recall, xlabel: "dropout rate", title: "Validation curve: mean recall vs dropout rate (mean of 3 seeds)"}
  layout: half
  caption_es: "Curva de validación del dropout sobre el modelo de la entrega 1: mean recall de train (discontinua) y de validación (continua), media de 3 semillas."
  caption_slides_es: "Mean recall de train y de validación según el dropout."

- id: l2_curve
  type: strength
  select: {base: EXP-010_bs256_sqrt_60ep, prefix: EXP-013_l2, param: l2}
  options: {metric: mean_recall, logx: true, xlabel: "L2 factor (log)", title: "Validation curve: mean recall vs L2 factor (mean of 3 seeds)"}
  layout: half
  caption_es: "Curva de validación de la penalización L2 sobre el modelo de la entrega 1: mean recall de train (discontinua) y de validación (continua), media de 3 semillas."
  caption_slides_es: "Mean recall de train y de validación según el factor L2."

- id: batchnorm
  type: dumbbell
  select:
    variants:
      - {variant: EXP-010_bs256_sqrt_60ep, label: "no BN (delivery 1)", role: baseline}
      - {variant: EXP-013_bn_before, label: "BN before act."}
      - {variant: EXP-013_bn_after, label: "BN after act."}
      - {variant: EXP-013_bn_before_lr3x, label: "BN before, lr x3", highlight: true}
      - {variant: EXP-013_bn_after_lr3x, label: "BN after, lr x3"}
  options: {metric: mean_recall, title: "BatchNorm (3 seeds)"}
  layout: half
  caption_es: "BatchNorm antes o después de la activación, con la learning rate de la entrega 1 o triplicada: mean recall de validación (punto relleno: media de 3 semillas; puntos pequeños: cada semilla) y de train (punto hueco); la línea que los une marca su distancia en mean recall. Punteado: el modelo sin BatchNorm; en negrita, la variante elegida."
  caption_slides_es: "Mean recall de validación (relleno) y de train (hueco)."

- id: augmentation
  type: dumbbell
  select:
    variants:
      - {variant: EXP-019_none_patience15, label: "no augmentation", role: baseline}
      - {variant: EXP-019_flip, label: "flips"}
      - {variant: EXP-019_rot90, label: "90° rotations", highlight: true}
      - {variant: EXP-019_d4, label: "D4 (flips + rotations)"}
      - {variant: EXP-019_color, label: "brightness/contrast"}
      - {variant: EXP-019_d4_color, label: "D4 + brightness/contrast"}
  options: {metric: mean_recall, title: "Data augmentation on the BN model (3 seeds)"}
  layout: half
  caption_es: "Data augmentation sobre el modelo con BatchNorm: mean recall de validación (punto relleno: media de 3 semillas; puntos pequeños: cada semilla) y de train (punto hueco); la línea que los une marca su distancia en mean recall. Punteado: sin augmentation; en negrita, la variante elegida."
  caption_slides_es: "Mean recall de validación (relleno) y de train (hueco)."

- id: capacity_reg
  type: capacity_reg
  select:
    pattern: "EXP-024_w{w}_{r}"
    widths: [256, 512, 1024]
    overrides: {"256_none": EXP-021_final}
    regs:
      - {tag: none, label: "no Dropout, no L2"}
      - {tag: dropout0.2, label: "Dropout 0.2"}
      - {tag: dropout0.5, label: "Dropout 0.5"}
      - {tag: l2_1e-4, label: "L2 1e-4"}
  options: {chosen: "256_none", size: [8.4, 3.2]}
  layout: full
  caption_es: "Capacidad × regularización sobre el modelo con BatchNorm y rotaciones (3 semillas por celda). Izquierda: mean recall de validación según la anchura de las 4 capas ocultas, una línea por regularizador (banda: mínimo y máximo de las semillas; estrella: la configuración elegida). Derecha: brecha entre la accuracy de train y la de validación."
  caption_slides_es: "Izq.: mean recall de validación. Dcha.: brecha train-val (pp)."

- id: progress
  type: progress
  options: {title: "Progress: validation metric after each step (mean of 3 seeds)"}
  layout: full
  caption_es: "Mean recall y accuracy de validación tras cada paso de la entrega (media de 3 semillas)."
  caption_slides_es: "Mean recall y accuracy de validación tras cada paso."

- id: stopping
  type: stopping
  select: {run: EXP-021_final}   # seed 1 = the run reproduced by the notebook
  options: {title: "Final model (seed 1): when to stop"}
  layout: half
  caption_es: "Modelo final (semilla 1): accuracy de train (la única métrica de train que se registra por época; medida con augmentation) y de validación y mean recall de validación por época. Punteado: bajadas de la lr; estrella: época conservada; cruz: parada."
  caption_slides_es: "Semilla 1. Sombreado: tras la mejor época solo mejora train."

- id: per_class_recall
  type: per_class_recall
  select: {baseline: EXP-010_bs256_sqrt_60ep, final: EXP-021_final}
  layout: full
  caption_es: "Recall de validación por clase: modelo de la entrega 1 frente al de esta entrega (media de 3 semillas en ambos)."
  caption_slides_es: "Recall de validación por clase: entrega 1 frente a entrega 2."

- id: confusion                        # its own slide, right before the conclusions (DEC-012)
  type: confusion
  select: {variant: EXP-021_final}
  options: {title: "Final model: confusion matrix (validation, mean of 3 seeds)"}
  layout: full
  caption_es: "Matriz de confusión de validación del modelo final, normalizada por filas (cada fila suma 1): media de las matrices de las 3 semillas."
  caption_slides_es: "Validación, normalizada por filas (media de 3 semillas)."
