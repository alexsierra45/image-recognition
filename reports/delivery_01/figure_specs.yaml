# Curated figures of delivery 1 (phases 0-5), redrawn from experiments/ (never copied from experiments/plots/), in the
# same style as the experiment plots (plot_theme.py), English labels, PNG: overleaf/figures/<id>.png. The same PNG is
# used in the report and in the slides. Captions (caption_es) are Spanish: they are document text.
# Selection rules are fixed here, before looking at the figures, and are based on validation metrics only.

- id: class_distribution
  type: class_distribution
  layout: half
  caption_es: "Imágenes por clase en el conjunto de entrenamiento."

- id: resolution_sweep
  type: sweep
  select:
    exp_id: EXP-005
    x: res
    filter: {lr: 0.001}                 # the main sweep (all sizes at the same lr)
    best_lr_per_x: true                 # plus, per size, its best lr from the joint grid
  options: {logx: true, show_train: true, xlabel: "input resolution (side, log)", title: "Phase 2: mean recall vs input resolution"}
  layout: half
  caption_es: "Mean recall de validación (continua) y de train (discontinua) según la resolución de entrada, con una capa oculta de 256."

- id: capacity
  type: capacity
  select: {exp_id: EXP-006}
  layout: half
  caption_es: "Accuracy de train (discontinua) y de validación (continua) de las 12 arquitecturas probadas según su número de parámetros, una línea por número de capas ocultas."

- id: lr_sweep
  type: group_sweep
  select:
    exp_id: EXP-008
    x: optimizer.lr
    group: optimizer.name
    group_labels: {adam: "Adam", sgd: "SGD + momentum 0.9"}
  options: {logx: true, xlabel: "learning rate (log)", title: "Phase 5: mean recall vs learning rate (<= 20 epochs)"}
  layout: half
  caption_es: "Mean recall de validación (continua) y de train (discontinua) según la learning rate, para Adam y SGD con momentum (los 8 runs de la fase 5.1, entrenamientos de hasta 20 épocas)."

- id: stopping
  type: stopping
  select: {variant: EXP-010_bs256_sqrt_60ep}
  options: {metric: mean_recall, title: "Final model: validation mean recall per epoch (3 seeds)"}
  layout: half
  caption_es: "Punto de parada del modelo final: mean recall de validación por época para cada semilla. La estrella marca la mejor época (la que se conserva) y la cruz, la época en que se detiene EarlyStopping."

- id: progress
  type: progress
  options: {title: "Progress: validation metric after each phase (phases 4-5: mean of 3 seeds)"}
  layout: full
  caption_es: "Mean recall y accuracy de validación tras cada fase (fases 4 y 5: media de 3 semillas)."

- id: per_class_recall
  type: per_class_recall
  select: {baseline: EXP-001, final: EXP-010_bs256_sqrt_60ep}
  layout: full
  caption_es: "Recall de validación por clase: baseline frente al modelo final (media de 3 semillas)."
